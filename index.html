<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00DAFF">
  <title>Full Tune · Bobek Customs</title>
  <link rel="icon" href="logo.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      if (localStorage.getItem('bobekcustoms-theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (error) {
      console.warn('Nie udało się odczytać zapisanego motywu.', error);
    }
  </script>
</head>
<body>
  <div class="shell">
    <header class="topline"><a class="brand" href="#" aria-label="Bobek Customs"><img src="logo.svg" alt="Bobek Customs" onerror="this.onerror=null;this.src='logo.png'"><span>BOBEK CUSTOMS</span></a><div class="header-tools"><div class="status"><i></i>KALKULATOR TUNINGU</div><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Przełącz na ciemny motyw" title="Przełącz na ciemny motyw"><svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.6 8.6 0 1 0 20.2 15.1Z"/></svg><span class="theme-label">Ciemny</span></button></div></header>
    <main>
      <section id="tune-view">
        <div class="hero"><div><div class="eyebrow">Wybierz pojazd</div><h1>FULL TUNE</h1><p>Znajdź model, wybierz fulltune albo skomponuj tuning z pojedynczych części.</p></div><div class="load-status" id="load-status"></div></div>
        <div class="searchbar"><span>⌕</span><input id="q" type="search" placeholder="Wpisz model auta…" autocomplete="off" aria-label="Szukaj modelu auta"></div>
        <p class="searchhint">Ceny pokazane przy modelu: <b>salonowa</b> i <b>full tuning</b>.</p>
        <div id="grid" class="cars"></div>
      </section>
    </main>
    <footer class="foot"><span>BOBEK CUSTOMS · CENNIK </span><span>Wybierz model, by zobaczyć ceny i części.</span></footer>
  </div>
  <div id="modal-root"></div>
  <script src="data.js"></script><script src="app.js"></script><script src="theme.js"></script>
</body>
</html>
